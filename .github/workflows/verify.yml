name: Verify
run-name: 'Verify ${{ github.sha }} (${{ github.ref_name }})'

on:
  pull_request:
    branches: ['*']
  workflow_call:

env:
  RUNTIME: node@26

jobs:
  verify:
    runs-on: ubuntu-latest
    needs:
      - build-apex
      - build-docs
      - fmtcheck
    steps:
      - run: echo "41°00′19″N 122°59′51″W"

  build-apex:
    uses: ./.github/workflows/build.yml
    with:
      website: apex

  build-docs:
    uses: ./.github/workflows/build.yml
    with:
      website: docs

  fmtcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: ${{ env.RUNTIME }}
      - run: pnpm fmtcheck
