name: Build
run-name: 'Build ${{ inputs.website }} website'

on:
  workflow_call:
    inputs:
      website:
        type: string
        required: true

env:
  RUNTIME: node@26

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "${{ inputs.website }}" in
            "apex"|"docs") ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: ${{ env.RUNTIME }}
      - run: pnpm build
        working-directory: ${{ inputs.website }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: zip -qr ../../${{ inputs.website }}.zip .
        working-directory: ${{ inputs.website }}/dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.website }}.zip
          path: ${{ inputs.website }}.zip
