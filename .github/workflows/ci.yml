name: CI
run-name: CI deploy to dev env

on:
  push:
    branches: ['main']

jobs:
  verify-apex:
    uses: ./.github/workflows/verify_apex.yml

  verify-docs:
    uses: ./.github/workflows/verify_docs.yml

  deploy-apex:
    needs: verify-apex
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      cloudflare_env: dev
      dev_build: true
      website: apex
    secrets: inherit

  deploy-docs:
    needs: verify-docs
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy.yml
    with:
      cloudflare_env: dev
      dev_build: true
      website: docs
    secrets: inherit
