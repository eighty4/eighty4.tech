name: Verify ./docs
run-name: 'Verify ./docs ${{ github.sha }} (${{ github.ref_name }})'

on:
  pull_request:
    branches: ['*']
    paths:
      - 'docs/**/*'
      - '*.json'
      - '*.yaml'
  workflow_call:

env:
  RUNTIME: node@26

jobs:
  verify:
    runs-on: ubuntu-latest
    needs:
      - build-docs
      - verify-content
      - verify-format
      - test-docs-e2e
    steps:
      - run: echo "41°00′19″N 122°59′51″W"

  build-docs:
    uses: ./.github/workflows/build_docs.yml

  verify-content:
    uses: ./.github/workflows/verify_content.yml

  verify-format:
    uses: ./.github/workflows/verify_format.yml

  test-docs-e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: ${{ env.RUNTIME }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: docs
      - run: pnpm exec playwright test --project="*chromium"
        working-directory: docs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: docs/playwright-report/
          retention-days: 7
